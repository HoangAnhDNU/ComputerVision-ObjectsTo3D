data:
  data_dir: "Cap3D_data"
  num_points: 2048
  image_size: 224
  batch_size: 8
  num_workers: 0

model:
  clip_model: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  freeze_clip: true
  fusion_type: "concat"    # "concat" hoặc "cross_attention"
  fused_dim: 512
  coarse_points: 256
  fine_points: 2048

training:
  epochs: 50
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 5
  patience: 20
  cooldown_seconds: 30    # Nghỉ giữa epoch để giảm nhiệt (0 = tắt)

loss:
  lambda_cd: 1.0
  lambda_emd: 0.5
  lambda_color: 0.2
  use_emd: false

logging:
  log_dir: "runs"
  checkpoint_dir: "checkpoints"
  log_every: 10
  val_every: 1
