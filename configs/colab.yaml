# Config tối ưu cho Google Colab T4 GPU (16GB VRAM)
# So với default.yaml:
#   - batch_size: 8 → 32 (T4 đủ VRAM)
#   - epochs: 50 → 100 (Colab nhanh hơn)
#   - lr: 0.0005 → 0.001 (batch lớn → LR cao hơn)
#   - lambda_color: 0.2 → 0.5 (cải thiện màu sắc)
#   - cooldown: 30 → 0 (không cần trên GPU server)
#   - num_workers: 0 → 2

data:
  data_dir: "Cap3D_data"
  num_points: 2048
  image_size: 224
  batch_size: 32
  num_workers: 2

model:
  clip_model: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  freeze_clip: true
  fusion_type: "concat"
  fused_dim: 512
  coarse_points: 256
  fine_points: 2048

training:
  epochs: 100
  lr: 0.001
  weight_decay: 0.01
  warmup_epochs: 3
  patience: 25
  cooldown_seconds: 0

loss:
  lambda_cd: 1.0
  lambda_emd: 0.5
  lambda_color: 0.5
  use_emd: false

logging:
  log_dir: "runs"
  checkpoint_dir: "checkpoints"
  log_every: 10
  val_every: 1
