# Config cho Google Colab (auto-generated bởi notebook Cell 12)
# File này được ghi đè mỗi lần chạy Cell 12 trên Colab.
# Giá trị dưới đây là mặc định cho Colab Pro A100.
# Trên Colab, data_dir sẽ là path tuyệt đối trên Drive.

data:
  data_dir: "Cap3D_data"      # Relative (PC) hoặc absolute (Colab)
  num_points: 2048
  image_size: 224
  batch_size: 32
  num_workers: 2
  max_objects: 0               # 0 = dùng toàn bộ dataset
  num_views: 4                 # Số view/object (1=single, 4=multi-view DiffuRank)

model:
  clip_model: "ViT-B-32"
  pretrained: "laion2b_s34b_b79k"
  freeze_clip: true
  decoder_type: "transformer"    # "transformer" (mới, chất lượng cao) hoặc "mlp" (cũ)
  decoder_width: 256
  decoder_layers: 4
  decoder_heads: 4
  fine_layers: 2
  fusion_type: "concat"          # Chỉ dùng khi decoder_type=mlp
  fused_dim: 512
  coarse_points: 256
  fine_points: 2048

training:
  epochs: 100
  lr: 0.001
  weight_decay: 0.01
  warmup_epochs: 5
  patience: 25
  cooldown_seconds: 0          # 0 = Colab mode, >0 = local PC mode

loss:
  lambda_cd: 1.0
  lambda_emd: 0.5
  lambda_color: 0.5
  lambda_repulsion: 0.1           # Chống tụ cụm → giảm lỗ chỗ
  lambda_uniform: 0.05            # Phân bố đều → bao phủ bề mặt
  repulsion_k: 8                  # Số k-NN để xét repulsion
  repulsion_h: 0.03               # Ngưỡng khoảng cách repulsion
  use_emd: false
  lambda_normal: 0.05          # Normal consistency (Laplacian smoothness)
  normal_k: 8                  # Số k-NN cho normal loss

logging:
  log_dir: "runs"
  checkpoint_dir: "checkpoints"
  log_every: 10
  val_every: 1
