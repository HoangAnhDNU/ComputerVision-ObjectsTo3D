data:
  batch_size: 64
  data_dir: Cap3D_data
  image_size: 224
  max_objects: 0
  num_points: 2048
  num_workers: 4
  num_views: 1
logging:
  checkpoint_dir: checkpoints
  log_dir: runs
  log_every: 10
  save_every: 200
  val_every: 1
loss:
  lambda_cd: 1.0
  lambda_color: 0.5
  lambda_emd: 0.5
  lambda_normal: 0.05
  lambda_repulsion: 0.1
  lambda_uniform: 0.05
  normal_k: 8
  repulsion_h: 0.03
  repulsion_k: 8
  use_emd: false
model:
  clip_model: ViT-B-32
  coarse_points: 256
  decoder_heads: 6
  decoder_layers: 6
  decoder_type: transformer
  decoder_width: 384
  fine_layers: 3
  fine_points: 2048
  freeze_clip: true
  fused_dim: 512
  fusion_type: concat
  pretrained: laion2b_s34b_b79k
training:
  cooldown_seconds: 0
  epochs: 100
  lr: 0.001
  patience: 25
  warmup_epochs: 5
  weight_decay: 0.01
